name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build API and web
        run: npm run build
      - name: Migration drift check
        run: npm run db:check
      - name: Database invariant tests
        run: npm run test:db
      - name: API integration tests with PGlite
        run: npm run test:auth
      - name: Frontend lint
        run: npm run lint
